<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student UniDash | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>UniDash</h2>
            </div>
            <ul>
                <li><button class="nav-btn active" onclick="loadPage('overview', this)"><i class="fa-solid fa-house"></i> Overview</button></li>
                <li><button class="nav-btn" onclick="loadPage('canvas', this)"><i class="fa-solid fa-book"></i> Canvas</button></li>
                <li><button class="nav-btn" onclick="loadPage('hac', this)"><i class="fa-solid fa-chart-simple"></i> HAC Grades</button></li>
                <li><button class="nav-btn" onclick="loadPage('gmail', this)"><i class="fa-solid fa-envelope"></i> Gmail</button></li>
                <li><button class="nav-btn" onclick="loadPage('browser', this)"><i class="fa-solid fa-globe"></i> App Browser</button></li>
                <li><button class="nav-btn" onclick="loadPage('zipper', this)"><i class="fa-solid fa-globe"></i> Zipper</button></li>
                <li><button class="nav-btn" onclick="loadPage('playlist', this)"><i class="fa-solid fa-music"></i> Playlist</button></li>
                <li><button class="nav-btn" onclick="loadPage('settings', this)"><i class="fa-solid fa-gear"></i> Settings</button></li>
            </ul>

            <div class="mini-player" style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto;">
                <p id="now-playing-title" style="font-size: 12px; margin-bottom: 8px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Not Playing</p>
                <audio id="main-audio-player" style="display: none;"></audio>
            </div>

            <div class="user-profile">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <p class="name">Student User</p>
                    <p class="status">Online</p>
                </div>
            </div>
        </nav>

        <main class="content" id="main-content-area">
        </main>
    </div>

    <script src="hac.js"></script>
    <script src="app.js"></script>
    <script>
        // Automatically load the Overview page when the shell loads
        window.addEventListener('DOMContentLoaded', () => {
            loadPage('overview', document.querySelector('.nav-btn.active'));
        });
    </script>

    <div id="debug-console" style="position: fixed; bottom: 0; right: 0; width: 300px; max-height: 200px; background: rgba(0,0,0,0.8); color: #00ff00; font-family: monospace; font-size: 10px; padding: 10px; overflow-y: auto; z-index: 9999; border-top-left-radius: 8px;">
        <div style="border-bottom: 1px solid #333; margin-bottom: 5px; font-weight: bold; display: flex; justify-content: space-between;">
            SYSTEM LOGS
            <span onclick="toggleConsole()" style="cursor:pointer; color: #aaa;">✕</span>
        </div>
        <div id="debug-logs"></div>
    </div>

    <script>
        // Backtick (`) key toggles the console
        document.addEventListener('keydown', (e) => {
            if (e.key === '`') toggleConsole();
        });
    </script>
    
    <script>
        const logContainer = document.getElementById('debug-logs');
        const originalLog = console.log;
        const originalError = console.error;
    
        console.log = function(...args) {
            originalLog.apply(console, args);
            const el = document.createElement('div');
            el.innerText = "> " + args.join(' ');
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        };
    
        console.error = function(...args) {
            originalError.apply(console, args);
            const el = document.createElement('div');
            el.style.color = "#ff4444";
            el.innerText = "[ERROR] " + args.join(' ');
            logContainer.appendChild(el);
            logContainer.scrollTop = logContainer.scrollHeight;
        };
        
        console.log("Debugger Initialized");
    </script>
</body>
</html>
