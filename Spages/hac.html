<section id="hac">
    <header class="section-header">
        <h1><i class="fa-solid fa-chart-simple" style="color:var(--primary);"></i> HAC Grades</h1>
        <p>Six weeks grades and assignment breakdown.</p>
    </header>

    <!-- LOGIN PANEL — hidden by default since data is static -->
    <div id="hac-login-panel" class="card" style="display:none; max-width: 460px; margin: 0 auto;"></div>

    <!-- GRADES OUTPUT — shown immediately -->
    <div id="hac-grades-panel">
        <div id="hac-summary" style="display:flex; align-items:center; gap:12px; margin-bottom:28px; flex-wrap:wrap;"></div>
        <div id="hac-data" class="card-grid" style="grid-template-columns: 1fr;"></div>
    </div>
</section>
