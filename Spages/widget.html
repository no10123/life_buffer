<section id="widget-board" style="padding: 20px; height: 100%; display: flex; flex-direction: column;">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Widgets</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: bold;">
                <input type="checkbox" id="mode-toggle" style="width: 18px; height: 18px;"> Edit Mode
            </label>
            <button id="add-widget-btn" style="display: none; background: var(--primary, #3b82f6); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <div id="widget-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; align-items: start;">
        </div>

    <div id="widget-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <h2 style="margin-top: 0;">Add Widget</h2>
            
            <label>Widget Type:</label>
            <select id="w-type" style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;">
                <option value="counter">Counter</option>
                <option value="dual_counter">Dual Counter</option>
                <option value="link">Link</option>
                <option value="img">Image</option>
                <option value="custom_btn">Custom JS Button</option>
                <option value="file">File Shortcut</option>
                <option value="note">Sticky Note</option>
            </select>

            <div id="dynamic-inputs" style="margin-bottom: 15px;">
                </div>

            <label>Color Theme:</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div class="color-preset" data-color="#ffb3ba" style="width: 25px; height: 25px; background: #ffb3ba; border-radius: 50%; cursor: pointer; border: 2px solid transparent;"></div>
                <div class="color-preset" data-color="#ffdfba" style="width: 25px; height: 25px; background: #ffdfba; border-radius: 50%; cursor: pointer; border: 2px solid transparent;"></div>
                <div class="color-preset" data-color="#ffffba" style="width: 25px; height: 25px; background: #ffffba; border-radius: 50%; cursor: pointer; border: 2px solid transparent;"></div>
                <div class="color-preset" data-color="#baffc9" style="width: 25px; height: 25px; background: #baffc9; border-radius: 50%; cursor: pointer; border: 2px solid transparent;"></div>
                <div class="color-preset" data-color="#bae1ff" style="width: 25px; height: 25px; background: #bae1ff; border-radius: 50%; cursor: pointer; border: 2px solid transparent;"></div>
                <input type="color" id="w-color-picker" style="width: 30px; height: 30px; border: none; cursor: pointer;">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button id="close-modal-btn" style="padding: 8px 15px; border: none; background: #eee; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button id="save-widget-btn" style="padding: 8px 15px; border: none; background: var(--primary, #3b82f6); color: white; border-radius: 6px; cursor: pointer;">Add</button>
            </div>
        </div>
    </div>

    <style>
        .widget-card {
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            position: relative;
            color: #333;
            text-align: center;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .widget-card img { max-width: 100%; max-height: 100px; border-radius: 8px; }
        .edit-mode .widget-card { cursor: grab; border: 2px dashed rgba(0,0,0,0.2); animation: wiggle 2s infinite ease-in-out; }
        .edit-mode .widget-card:active { cursor: grabbing; }
        .delete-w-btn { display: none; position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; z-index: 10; }
        .edit-mode .delete-w-btn { display: block; }
        
        .w-btn { background: rgba(255,255,255,0.5); border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: bold; margin: 2px; }
        .w-btn:hover { background: rgba(255,255,255,0.8); }
        .w-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        
        @keyframes wiggle {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-1deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(1deg); }
            100% { transform: rotate(0deg); }
        }
    </style>

    <script>
        // Wrapped in IIFE to prevent global variable collisions when swapping pages
        (function() {
            let widgets = JSON.parse(localStorage.getItem('dashboardWidgets')) || [];
            let isEditMode = false;
            let selectedColor = '#bae1ff';
            let draggedIndex = null;

            const grid = document.getElementById('widget-grid');
            const modeToggle = document.getElementById('mode-toggle');
            const addBtn = document.getElementById('add-widget-btn');
            const modal = document.getElementById('widget-modal');
            const typeSelect = document.getElementById('w-type');
            const dynamicInputs = document.getElementById('dynamic-inputs');

            // --- RENDER WIDGETS ---
            function renderWidgets() {
                grid.innerHTML = '';
                if(isEditMode) grid.classList.add('edit-mode');
                else grid.classList.remove('edit-mode');

                widgets.forEach((w, index) => {
                    const card = document.createElement('div');
                    card.className = 'widget-card';
                    card.style.backgroundColor = w.color;
                    if(isEditMode) {
                        card.draggable = true;
                        card.ondragstart = (e) => { draggedIndex = index; e.dataTransfer.effectAllowed = "move"; };
                        card.ondragover = (e) => e.preventDefault();
                        card.ondrop = (e) => {
                            e.preventDefault();
                            if (draggedIndex === index) return;
                            // Swap logic
                            const draggedWidget = widgets[draggedIndex];
                            widgets.splice(draggedIndex, 1);
                            widgets.splice(index, 0, draggedWidget);
                            saveAndRender();
                        };
                    }

                    // Delete button
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-w-btn';
                    delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    delBtn.onclick = (e) => { e.stopPropagation(); widgets.splice(index, 1); saveAndRender(); };
                    card.appendChild(delBtn);

                    // Render specific widget content
                    const content = document.createElement('div');
                    content.style.width = '100%';
                    content.style.height = '100%';

                    if (w.type === 'counter') {
                        content.innerHTML = `<h3 style="margin:0 0 10px 0;">${w.title || 'Counter'}</h3><h1 style="margin:0;">${w.value || 0}</h1>`;
                        if(!isEditMode) card.onclick = () => { w.value = (w.value || 0) + Number(w.countBy || 1); saveAndRender(); };
                    } 
                    else if (w.type === 'dual_counter') {
                        content.innerHTML = `<h3 style="margin:0;">${w.title || 'Counter'}</h3><h1 style="margin:10px 0;">${w.value || 0}</h1>
                            <div style="display:flex; justify-content:center; gap:10px;">
                                <button class="w-btn d-down"><i class="fa-solid fa-minus"></i></button>
                                <button class="w-btn d-up"><i class="fa-solid fa-plus"></i></button>
                            </div>`;
                        if(!isEditMode) {
                            content.querySelector('.d-up').onclick = (e) => { e.stopPropagation(); w.value = (w.value || 0) + 1; saveAndRender(); };
                            content.querySelector('.d-down').onclick = (e) => { e.stopPropagation(); w.value = (w.value || 0) - 1; saveAndRender(); };
                        }
                    }
                    else if (w.type === 'link') {
                        content.innerHTML = `<i class="fa-solid fa-link" style="font-size:24px;"></i><h3 style="margin:10px 0 0 0;">${w.title}</h3>`;
                        if(!isEditMode) card.onclick = () => window.open(w.url, '_blank');
                        if(!isEditMode) card.style.cursor = 'pointer';
                    }
                    else if (w.type === 'img') {
                        content.innerHTML = `<img src="${w.imgUrl}" alt="Widget Image" onerror="this.src='https://via.placeholder.com/150?text=Broken+Link'">`;
                    }
                    else if (w.type === 'custom_btn') {
                        content.innerHTML = `<button class="w-btn" style="padding:15px; width:100%; font-size:16px;">${w.title || 'Execute'}</button>`;
                        if(!isEditMode) content.querySelector('button').onclick = () => {
                            try { new Function(w.jsCode)(); } catch(err) { alert("JS Error: " + err.message); }
                        };
                    }
                    else if (w.type === 'file') {
                        content.innerHTML = `<i class="fa-solid fa-file" style="font-size:24px;"></i><h3 style="margin:10px 0 0 0;">${w.fileName || 'File'}</h3>`;
                        if(!isEditMode) card.onclick = () => {
                            const newTab = window.open();
                            newTab.document.write(`<iframe src="${w.fileData}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
                        };
                        if(!isEditMode) card.style.cursor = 'pointer';
                    }
                    else if (w.type === 'note') {
                        content.innerHTML = `<h4 style="margin:0 0 5px 0;">${w.title || 'Notes'}</h4>
                            <textarea style="width:100%; height:80px; resize:none; border:none; background:rgba(255,255,255,0.4); border-radius:6px; padding:5px; box-sizing:border-box;" ${isEditMode ? 'disabled' : ''}>${w.text || ''}</textarea>`;
                        if(!isEditMode) {
                            const ta = content.querySelector('textarea');
                            ta.oninput = (e) => { w.text = e.target.value; localStorage.setItem('dashboardWidgets', JSON.stringify(widgets)); };
                        }
                    }

                    card.appendChild(content);
                    grid.appendChild(card);
                });
            }

            function saveAndRender() {
                localStorage.setItem('dashboardWidgets', JSON.stringify(widgets));
                renderWidgets();
            }

            // --- MODE TOGGLE ---
            modeToggle.onchange = (e) => {
                isEditMode = e.target.checked;
                addBtn.style.display = isEditMode ? 'block' : 'none';
                renderWidgets();
            };

            // --- ADD WIDGET MODAL LOGIC ---
            addBtn.onclick = () => { modal.style.display = 'flex'; updateModalInputs(); };
            document.getElementById('close-modal-btn').onclick = () => modal.style.display = 'none';

            typeSelect.onchange = updateModalInputs;

            function updateModalInputs() {
                const type = typeSelect.value;
                let html = `<input type="text" id="w-title" class="w-input" placeholder="Widget Title" style="margin-bottom:10px;">`;
                
                if (type === 'counter') html += `<input type="number" id="w-countby" class="w-input" placeholder="Count By (e.g. 1)" value="1">`;
                else if (type === 'link') html += `<input type="url" id="w-url" class="w-input" placeholder="https://example.com">`;
                else if (type === 'img') html += `<input type="url" id="w-img" class="w-input" placeholder="Image URL">`;
                else if (type === 'custom_btn') html += `<textarea id="w-js" class="w-input" placeholder="alert('Hello!');" rows="3"></textarea>`;
                else if (type === 'file') html += `<input type="file" id="w-file" class="w-input">`;
                
                dynamicInputs.innerHTML = html;
            }

            // --- COLOR PICKER LOGIC ---
            document.querySelectorAll('.color-preset').forEach(el => {
                el.onclick = (e) => {
                    document.querySelectorAll('.color-preset').forEach(c => c.style.borderColor = 'transparent');
                    e.target.style.borderColor = '#333';
                    selectedColor = e.target.dataset.color;
                };
            });
            document.getElementById('w-color-picker').onchange = (e) => selectedColor = e.target.value;

            // --- SAVE NEW WIDGET ---
            document.getElementById('save-widget-btn').onclick = () => {
                const type = typeSelect.value;
                const title = document.getElementById('w-title')?.value || 'Widget';
                let newWidget = { id: Date.now().toString(), type, color: selectedColor, title };

                if (type === 'counter') { newWidget.countBy = document.getElementById('w-countby').value; newWidget.value = 0; }
                else if (type === 'dual_counter') { newWidget.value = 0; }
                else if (type === 'link') { newWidget.url = document.getElementById('w-url').value; }
                else if (type === 'img') { newWidget.imgUrl = document.getElementById('w-img').value; }
                else if (type === 'custom_btn') { newWidget.jsCode = document.getElementById('w-js').value; }
                else if (type === 'note') { newWidget.text = ""; }
                else if (type === 'file') {
                    const fileInput = document.getElementById('w-file');
                    if (fileInput.files.length > 0) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            newWidget.fileName = fileInput.files[0].name;
                            newWidget.fileData = e.target.result; // Saves as Base64 String
                            widgets.push(newWidget);
                            saveAndRender();
                            modal.style.display = 'none';
                        };
                        reader.readAsDataURL(fileInput.files[0]);
                        return; // Exit early because FileReader is async
                    }
                }

                widgets.push(newWidget);
                saveAndRender();
                modal.style.display = 'none';
            };

            // Init
            renderWidgets();
        })();
    </script>
</section>
