            // Floating holidays override logic (Calculates specific Sundays/Thursdays)
            function checkFloatingHolidays(d) {
                const month = d.getMonth();
                const day = d.getDay(); // 0 = Sunday, 1 = Monday...
                const date = d.getDate();

                // Mother's Day: 2nd Sunday in May
                if (month === 4 && day === 0 && date >= 8 && date <= 14) return "Mother's Day 💐";
                // Father's Day: 3rd Sunday in June
                if (month === 5 && day === 0 && date >= 15 && date <= 21) return "Father's Day 👔";
                // Thanksgiving: 4th Thursday in November
                if (month === 10 && day === 4 && date >= 22 && date <= 28) return "Thanksgiving 🦃";
                
                return null;
            }

            // --- CLOCK LOGIC ---
            function updateClock() {
                const now = new Date();
                
                // Formatting Time
                let hours = now.getHours();
                let minutes = now.getMinutes().toString().padStart(2, '0');
                let seconds = now.getSeconds().toString().padStart(2, '0');
                let ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; // Handle midnight (0)
                
                document.getElementById('live-time').innerHTML = `${hours}:${minutes}<span style="font-size: 2.5rem; color: #7f849c; margin-left: 10px;">${seconds} ${ampm}</span>`;

                // Formatting Date
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('live-date').innerText = now.toLocaleDateString('en-US', dateOptions);

                // Fetching the Daily Special Event
                const mm = (now.getMonth() + 1).toString().padStart(2, '0');
                const dd = now.getDate().toString().padStart(2, '0');
                const lookupKey = `${mm}-${dd}`;

                const floatingEvent = checkFloatingHolidays(now);
                const dailyEvent = floatingEvent || daysOfYear[lookupKey] || "Just a normal, awesome day! 🌟";
                const monthlyEvent = monthThemes[mm] || "A Great Month!";

                document.getElementById('daily-holiday').innerText = dailyEvent;
                document.getElementById('monthly-theme').innerText = monthlyEvent;
            }

            // Init and set interval loop
            updateClock();
            setInterval(updateClock, 1000);
