<section id="playlist">
    <header class="section-header">
        <h1>Music Hub</h1>
        <p>Your background vibe controller.</p>
    </header>

    <div class="card" style="margin-bottom: 20px;">
        <h3 style="margin-top:0;"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> Add YouTube Link</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <input type="text" id="yt-url" placeholder="Paste YouTube link here..." 
                   style="flex-grow: 1; padding: 12px; border-radius: 8px; border: 2px solid var(--primary); outline: none; background: white; color: black;">
            <button onclick="addYoutubeTrack()" style="background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                Add Track
            </button>
        </div>
        <small id="yt-status" style="display: block; color: var(--text-muted);"></small>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3><i class="fa-solid fa-file-arrow-up"></i> Local MP3s</h3>
        <input type="file" id="audio-upload" accept=".mp3, audio/*" multiple style="display: none;" onchange="handleAudioUpload(event)">
        <label for="audio-upload" style="background: #e2e8f0; color: #475569; display: inline-block; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">
            Upload Files
        </label>
    </div>

    <div class="card" style="margin-top: 20px; background: var(--primary); color: white;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
                <h4 id="ctrl-track-title" style="margin: 0;">Not Playing</h4>
                <p id="ctrl-track-status" style="margin: 0; font-size: 12px; opacity: 0.8; color: white;">Select a track</p>
            </div>
            <button onclick="togglePlay()" id="master-play-btn" style="width: 45px; height: 45px; border-radius: 50%; border: none; background: white; color: var(--primary); cursor: pointer;">
                <i class="fa-solid fa-play"></i>
            </button>
        </div>
    </div>

    <div id="playlist-tracks" style="margin-top: 20px;"></div>
</section>
