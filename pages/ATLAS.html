<script>
// Original JS — only changes: window.onload→init(), .view-tab queries scoped to #atlas-root
var app={modules:[]},currentModId=null,currentNoteId=null,drawMode=false,isPreviewMode=false;
var sessionStartTime=0,sessionStartWords=0,painting=false,canvasHistory=[],historyStep=-1,snapshot=null;
var canvas,ctx,startX,startY,dicePool=[],isRolling=false,globalDiceMode='norm';
var dragId=null,dragOff={x:0,y:0},didDrag=false;
const COLORS=['#ffb7b2','#ffdac1','#e2f0cb','#b5ead7','#c7ceea','#e1bee7'];

function init(){
    const stored=localStorage.getItem('atlas_v3');
    if(stored) app=JSON.parse(stored);
    renderModuleList();
    const editor=document.getElementById('editor-content');
    editor.addEventListener('focus',()=>{
        const note=getMod()&&getMod().notes.find(n=>n.id===currentNoteId);
        sessionStartTime=Date.now(); sessionStartWords=countWords(editor.innerText);
        if(isPreviewMode&&note){editor.innerHTML=note.html;isPreviewMode=false;}
    });
    editor.addEventListener('input',()=>{
        const note=getMod()&&getMod().notes.find(n=>n.id===currentNoteId);
        if(!isPreviewMode&&note) note.html=editor.innerHTML;
        updateStats();
    });
    editor.addEventListener('blur',()=>{saveCurrentDocBody();renderLatexAndLinks();});
    document.getElementById('map-text-input').addEventListener('keydown',e=>{if(e.key==='Enter')commitTextToCanvas();});
    document.getElementById('map-text-input').addEventListener('blur',commitTextToCanvas);
    // Canvas events scoped to atlas-root so they don't fight UniDash
    const root=document.getElementById('atlas-root');
    root.addEventListener('mousedown',e=>{
        if(!drawMode||e.target!==canvas)return;
        const c=getCanvasCoords(e); startX=c.x; startY=c.y;
        const type=document.getElementById('brush-type').value;
        if(type==='text'){commitTextToCanvas();const inp=document.getElementById('map-text-input');inp.style.display='block';inp.style.left=e.clientX+'px';inp.style.top=e.clientY+'px';inp.style.color=document.getElementById('brush-color').value;inp.value='';inp.focus();return;}
        if(type==='fill'){floodFill(c.x,c.y,ctx.fillStyle);saveState();return;}
        painting=true; snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(type==='pen'||type==='marker'||type==='eraser'){ctx.beginPath();ctx.moveTo(c.x,c.y);}
    });
    window.addEventListener('mouseup',()=>{if(painting){painting=false;ctx.beginPath();saveState();}});
    root.addEventListener('mousemove',e=>{
        if(!painting||!drawMode)return;
        const c=getCanvasCoords(e),type=document.getElementById('brush-type').value;
        if(type==='pen'||type==='marker'||type==='eraser'){ctx.lineTo(c.x,c.y);ctx.stroke();}
        else if(type==='spray'){const sz=document.getElementById('brush-size').value*2;for(let i=0;i<10;i++)ctx.fillRect(c.x+(Math.random()-.5)*sz*2,c.y+(Math.random()-.5)*sz*2,1,1);}
        else if(type==='rect'){ctx.putImageData(snapshot,0,0);ctx.strokeRect(startX,startY,c.x-startX,c.y-startY);}
        else if(type==='circle'){ctx.putImageData(snapshot,0,0);ctx.beginPath();ctx.arc(startX,startY,Math.hypot(c.x-startX,c.y-startY),0,2*Math.PI);ctx.stroke();}
    });
}

function saveApp(){localStorage.setItem('atlas_v3',JSON.stringify(app));}
function getMod(){return app.modules.find(m=>m.id===currentModId);}

function switchMainView(viewName){
    document.getElementById('view-map').classList.remove('active');
    document.getElementById('view-dice').classList.remove('active');
    document.querySelectorAll('#atlas-root .view-tab').forEach(t=>t.classList.remove('active'));
    if(viewName==='map'){document.getElementById('view-map').classList.add('active');document.querySelectorAll('#atlas-root .view-tab')[0].classList.add('active');setTimeout(initCanvas,10);}
    else{document.getElementById('view-dice').classList.add('active');document.querySelectorAll('#atlas-root .view-tab')[1].classList.add('active');}
}

function addDie(sides){if(isRolling)return;dicePool.push({id:Date.now()+Math.random(),sides,value:sides,state:globalDiceMode});renderTray();calculateAverage();}
function addCustomDie(){const s=parseInt(prompt('Sides (1-999):'));if(s&&s>0)addDie(s);}
function removeDie(id){dicePool=dicePool.filter(d=>d.id!==id);renderTray();calculateAverage();}
function toggleDieState(id){if(isRolling)return;const die=dicePool.find(d=>d.id===id);if(!die)return;die.state=die.state==='norm'?'adv':die.state==='adv'?'dis':'norm';renderTray();calculateAverage();}
function setGlobalMode(mode){globalDiceMode=mode;document.querySelectorAll('#atlas-root .adv-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`#atlas-root .adv-btn[data-mode="${mode}"]`).classList.add('active');}
function clearTray(){if(isRolling)return;dicePool=[];renderTray();document.getElementById('dice-total-display').innerText='0';calculateAverage();}
function renderTray(){
    const tray=document.getElementById('dice-tray-content');
    if(!dicePool.length){tray.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-style:italic;font-size:13px;">Add dice... Click die to toggle Adv/Dis independently.</div>';return;}
    tray.innerHTML='';
    dicePool.forEach(die=>{const el=document.createElement('div');el.className='tray-die';el.setAttribute('data-type','d'+die.sides);el.setAttribute('data-state',die.state);el.id='die-'+die.id;el.innerText=die.value;el.onclick=()=>toggleDieState(die.id);el.oncontextmenu=e=>{e.preventDefault();removeDie(die.id);return false;};tray.appendChild(el);});
}
function calculateAverage(){let sum=0;dicePool.forEach(d=>{const n=d.sides,b=(n+1)/2,sh=(n*n-1)/(6*n);sum+=d.state==='adv'?b+sh:d.state==='dis'?b-sh:b;});const mod=parseInt(document.getElementById('dice-modifier').value)||0;document.getElementById('dice-avg-display').innerText=`Exp. Avg: ${(sum+mod).toFixed(2)}`;}
function rollAllDice(){
    if(!dicePool.length||isRolling)return;isRolling=true;
    const modifier=parseInt(document.getElementById('dice-modifier').value)||0;
    dicePool.forEach(d=>{const el=document.getElementById('die-'+d.id);if(el)el.classList.remove('crit-anim');});
    let ticks=0;const interval=setInterval(()=>{ticks++;dicePool.forEach(die=>{const el=document.getElementById('die-'+die.id);if(el){el.innerText=Math.floor(Math.random()*die.sides)+1;el.classList.add('rolling');}});if(ticks>15){clearInterval(interval);finalizeRoll(modifier);}},80);
}
function finalizeRoll(modifier){
    let total=0;
    dicePool.forEach(die=>{const r1=Math.floor(Math.random()*die.sides)+1,r2=Math.floor(Math.random()*die.sides)+1;const v=die.state==='adv'?Math.max(r1,r2):die.state==='dis'?Math.min(r1,r2):r1;die.value=v;total+=v;const el=document.getElementById('die-'+die.id);if(el){el.innerText=v;el.classList.remove('rolling');if(v===die.sides)el.classList.add('crit-anim');}});
    const ft=total+modifier;document.getElementById('dice-total-display').innerText=`${total} (${modifier>=0?'+':''}${modifier}) = ${ft}`;isRolling=false;
}
function countWords(str){return str.trim().split(/\s+/).filter(w=>w.length>0).length;}
function updateStats(){const text=document.getElementById('editor-content').innerText,w=countWords(text);document.getElementById('stat-words').innerText=w;document.getElementById('stat-read').innerText=Math.ceil(w/200)+'m';const mins=(Date.now()-sessionStartTime)/60000;if(mins>0.05)document.getElementById('stat-wpm').innerText=Math.round(Math.max(0,w-sessionStartWords)/mins)||0;}
function renderModuleList(){const list=document.getElementById('module-list-container');list.innerHTML='';app.modules.forEach(m=>{const div=document.createElement('div');div.className='module-item';div.innerHTML=`<div style="flex-grow:1;cursor:pointer;" onclick="openModule('${m.id}')"><strong style="font-family:var(--font-doc);font-size:1.2em;">${m.name}</strong><div style="font-size:0.8em;color:var(--text-muted);margin-top:3px;">${m.notes.length} Notes</div></div><button class="icon-btn" style="color:var(--danger);" onclick="deleteModule('${m.id}')"><span class="material-icons">delete</span></button>`;list.appendChild(div);});}
function createModule(){const name=document.getElementById('new-module-name').value.trim();if(!name)return;app.modules.push({id:Date.now().toString(),name,notes:[],wb:null});saveApp();renderModuleList();document.getElementById('new-module-name').value='';}
function deleteModule(id){if(!confirm('Delete?'))return;app.modules=app.modules.filter(m=>m.id!==id);saveApp();renderModuleList();}
function openModule(id){currentModId=id;document.getElementById('screen-modules').classList.remove('active');document.getElementById('screen-workspace').classList.add('active');document.getElementById('current-module-title').innerText=getMod().name;initCanvas();renderSidebar();renderMap();switchMainView('map');}
function saveAndExit(){if(document.getElementById('view-map').classList.contains('active'))saveWhiteboard();saveApp();currentModId=null;document.getElementById('screen-workspace').classList.remove('active');document.getElementById('screen-modules').classList.add('active');renderModuleList();}
function renderSidebar(){const list=document.getElementById('sidebar-notes');list.innerHTML='';getMod().notes.sort((a,b)=>a.num-b.num).forEach(n=>{const el=document.createElement('div');el.className=`sidebar-note-item ${currentNoteId===n.id?'active':''}`;el.style.borderLeftColor=n.color;el.onclick=()=>openNoteInEditor(n.id);el.innerHTML=`<span class="sb-title">#${n.num} ${n.title}</span><span class="sb-desc">${n.desc||'No description'}</span>`;list.appendChild(el);});}
function createNote(){const mod=getMod(),max=mod.notes.reduce((a,n)=>Math.max(a,n.num),0);mod.notes.push({id:Date.now().toString(),num:max+1,title:`Topic ${max+1}`,desc:'',html:'',x:80+Math.random()*120,y:80+Math.random()*120,color:COLORS[Math.floor(Math.random()*COLORS.length)]});saveApp();renderSidebar();renderMap();}
function openNoteInEditor(id){currentNoteId=id;const note=getMod().notes.find(n=>n.id===id);document.getElementById('view-editor').classList.add('active');document.getElementById('doc-title').value=note.title;document.getElementById('doc-desc').value=note.desc||'';renderColorPicker();renderSidebar();document.getElementById('editor-content').innerHTML=note.html||'Start typing...';renderLatexAndLinks();updateStats();}
function closeEditor(){saveCurrentDocBody();currentNoteId=null;document.getElementById('view-editor').classList.remove('active');renderSidebar();if(document.getElementById('view-map').classList.contains('active'))renderMap();}
function renderColorPicker(){const cont=document.getElementById('node-color-picker');cont.innerHTML='';const note=getMod().notes.find(n=>n.id===currentNoteId);COLORS.forEach(color=>{const d=document.createElement('div');d.className=`color-option ${note.color===color?'active':''}`;d.style.backgroundColor=color;d.onclick=()=>{note.color=color;saveApp();renderColorPicker();renderSidebar();};cont.appendChild(d);});}
function saveCurrentDocHeader(){if(!currentNoteId)return;const note=getMod().notes.find(n=>n.id===currentNoteId);note.title=document.getElementById('doc-title').value;note.desc=document.getElementById('doc-desc').value;saveApp();}
function saveCurrentDocBody(){if(!currentNoteId||isPreviewMode)return;const note=getMod().notes.find(n=>n.id===currentNoteId);if(note){note.html=document.getElementById('editor-content').innerHTML;saveApp();}}
function formatDoc(cmd,value=null){document.execCommand(cmd,false,value);document.getElementById('editor-content').focus();}
function renderLatexAndLinks(){const editor=document.getElementById('editor-content');const note=getMod()&&getMod().notes.find(n=>n.id===currentNoteId);if(!note)return;let content=note.html;content=content.replace(/(?<!\$)\$(\d+)(?!\$)/g,(match,num)=>{const target=getMod().notes.find(n=>n.num==num);if(target)return `<span class="smart-link" onclick="jumpToNote('${target.id}')">&nbsp;${target.title}&nbsp;</span>`;return match;});editor.innerHTML=content;if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([editor]);isPreviewMode=true;}
function jumpToNote(targetId){if(!isPreviewMode)saveCurrentDocBody();openNoteInEditor(targetId);}
function renderMap(){const layer=document.getElementById('layer-nodes');layer.innerHTML='';getMod().notes.forEach(n=>{const el=document.createElement('div');el.className='map-node';el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.backgroundColor=n.color;el.innerText=n.num;el.title=n.title;el.onmousedown=e=>startDrag(e,n.id);layer.appendChild(el);});const svg=document.getElementById('layer-connections');svg.innerHTML='';const regex=/(?<!\$)\$(\d+)(?!\$)/g;getMod().notes.forEach(src=>{if(!src.html)return;[...src.html.matchAll(regex)].forEach(m=>{const target=getMod().notes.find(n=>n.num===parseInt(m[1]));if(target&&target.id!==src.id){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',src.x+22);line.setAttribute('y1',src.y+22);line.setAttribute('x2',target.x+22);line.setAttribute('y2',target.y+22);line.setAttribute('class','connection-line');svg.appendChild(line);}});});}
function startDrag(e,id){if(drawMode)return;e.stopPropagation();dragId=id;didDrag=false;const n=getMod().notes.find(x=>x.id===id);dragOff={x:e.clientX-n.x,y:e.clientY-n.y};window.addEventListener('mousemove',onDrag);window.addEventListener('mouseup',stopDrag);}
function onDrag(e){if(!dragId)return;didDrag=true;const n=getMod().notes.find(x=>x.id===dragId);n.x=e.clientX-dragOff.x;n.y=e.clientY-dragOff.y;renderMap();}
function stopDrag(){if(dragId&&!didDrag)openNoteInEditor(dragId);if(dragId)saveApp();dragId=null;window.removeEventListener('mousemove',onDrag);window.removeEventListener('mouseup',stopDrag);}
function initCanvas(){canvas=document.getElementById('layer-whiteboard');if(!canvas)return;ctx=canvas.getContext('2d',{willReadFrequently:true});const parent=document.getElementById('view-map');canvas.width=parent.clientWidth;canvas.height=parent.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);const mod=getMod();if(mod&&mod.wb){const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0);saveState();};img.src=mod.wb;}else saveState();updateBrush();}
function toggleDrawMode(){drawMode=!drawMode;document.getElementById('btn-draw-mode').classList.toggle('active',drawMode);document.getElementById('draw-tools').classList.toggle('hidden',!drawMode);const nodes=document.getElementById('layer-nodes');if(drawMode){canvas.style.pointerEvents='auto';canvas.style.cursor='crosshair';nodes.style.pointerEvents='none';}else{canvas.style.pointerEvents='none';canvas.style.cursor='';nodes.style.pointerEvents='auto';document.getElementById('map-text-input').style.display='none';saveWhiteboard();}}
function updateBrush(){if(!ctx)return;const color=document.getElementById('brush-color').value,type=document.getElementById('brush-type').value,size=document.getElementById('brush-size').value;ctx.lineWidth=size;ctx.lineJoin='round';ctx.lineCap='round';ctx.globalCompositeOperation='source-over';if(type==='eraser')ctx.globalCompositeOperation='destination-out';else if(type==='marker'){const r=parseInt(color.substr(1,2),16),g=parseInt(color.substr(3,2),16),b=parseInt(color.substr(5,2),16);const rgba=`rgba(${r},${g},${b},0.4)`;ctx.strokeStyle=rgba;ctx.fillStyle=rgba;ctx.lineWidth=size*3;ctx.lineCap='square';}else{ctx.strokeStyle=color;ctx.fillStyle=color;}}
function saveState(){historyStep++;if(historyStep<canvasHistory.length)canvasHistory.length=historyStep;canvasHistory.push(canvas.toDataURL());if(canvasHistory.length>10){canvasHistory.shift();historyStep--;}}
function undo(){if(historyStep>0){historyStep--;const img=new Image();img.src=canvasHistory[historyStep];img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);};}}
function saveWhiteboard(){if(currentModId){getMod().wb=canvas.toDataURL();saveApp();}}
function clearWhiteboard(){if(confirm('Clear drawing?')){ctx.clearRect(0,0,canvas.width,canvas.height);saveState();saveWhiteboard();}}
function getCanvasCoords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function commitTextToCanvas(){const input=document.getElementById('map-text-input');if(input.style.display==='none'||!input.value){input.style.display='none';return;}const rect=canvas.getBoundingClientRect();ctx.font="20px 'Crimson Pro'";ctx.fillStyle=input.style.color||'#2c3e50';ctx.fillText(input.value,parseInt(input.style.left)-rect.left,parseInt(input.style.top)-rect.top+18);input.value='';input.style.display='none';updateBrush();saveState();}
function floodFill(sx,sy,fillColorStr){const d=document.createElement('div');d.style.color=fillColorStr;document.body.appendChild(d);const col=window.getComputedStyle(d).color.match(/\d+/g).map(Number);document.body.removeChild(d);const[fR,fG,fB]=col;const pd=ctx.getImageData(0,0,canvas.width,canvas.height),data=pd.data;const sp=(Math.floor(sy)*canvas.width+Math.floor(sx))*4;const[sR,sG,sB]=[data[sp],data[sp+1],data[sp+2]];if(sR===fR&&sG===fG&&sB===fB)return;const stack=[[Math.floor(sx),Math.floor(sy)]];while(stack.length){const[x,y]=stack.pop(),pos=(y*canvas.width+x)*4;if(x<0||x>=canvas.width||y<0||y>=canvas.height)continue;if(Math.abs(data[pos]-sR)>10||Math.abs(data[pos+1]-sG)>10||Math.abs(data[pos+2]-sB)>10)continue;data[pos]=fR;data[pos+1]=fG;data[pos+2]=fB;data[pos+3]=255;stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}ctx.putImageData(pd,0,0);}

init();
</script>
