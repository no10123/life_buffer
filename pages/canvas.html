<section id="canvas">
    <header class="section-header">
        <h1><i class="fa-solid fa-book" style="color: var(--primary);"></i> Canvas Assignments</h1>
        <p>Track your upcoming homework and projects.</p>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="loadCanvasData()" id="refresh-canvas-btn" style="padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
            <button onclick="loadPage('settings')" style="padding: 8px 16px; background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 14px;">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </div>
    </header>

    <div id="canvas-status" style="margin-bottom: 20px; display: none;"></div>

    <div id="canvas-data" class="card-grid">
        <!-- Canvas assignments will be loaded here -->
    </div>
</section>
