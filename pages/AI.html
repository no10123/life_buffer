            // 2. Append Messages to Log
            function appendMessage(sender, text, color) {
                const msg = document.createElement('div');
                msg.style.lineHeight = '1.4';
                msg.innerHTML = `<span style="color: ${color}; font-weight: bold;">[${sender}]</span> ${text}`;
                chatLog.appendChild(msg);
                
                // Auto-scroll to the absolute bottom
                chatLog.scrollTop = chatLog.scrollHeight;
            }

            // 3. Process the Response Logic
            function processAIResponse() {
                const query = userInput.value.trim().toLowerCase();
                if (!query) return;

                // Log the user's text input
                appendMessage("USER", userInput.value, "#f5c2e7");
                userInput.value = ''; // Clear input field

                // Simulate a slight text processing delay (150ms)
                setTimeout(() => {
                    // Check if the query exists in our response dictionary
                    if (aiKnowledge[query] !== undefined) {
                        const responseText = aiKnowledge[query];
                        
                        // Handle special commands like clear
                        if (responseText === "CLEAR_COMMAND_TRIGGERED") {
                            chatLog.innerHTML = '<div style="color: #a6e3a1;">[SYSTEM] Terminal buffer cleared.</div>';
                        } else {
                            appendMessage("AI", responseText, "#a6e3a1");
                        }
                    } else {
                        // Fallback response if the key doesn't exist
                        appendMessage("AI", `Command or phrase "${query}" not found in local library database. Type 'help' for instructions.`, "#f38ba8");
                    }
                }, 150);
            }

            // 4. Event Triggers
            sendBtn.onclick = processAIResponse;
            
            userInput.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    processAIResponse();
                }
