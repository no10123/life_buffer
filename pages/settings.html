<section id="settings" class="settings-container">
    <header class="section-header">
        <h1>Dashboard Settings</h1>
        <p>Customize your experience.</p>
    </header>

    <div class="card">
        <h3><i class="fa-solid fa-palette"></i> Appearance</h3>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <label>
                <strong>Page Title:</strong><br>
                <input type="text" id="set-title" placeholder="UniDash" oninput="updateSettings()" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 300px;">
            </label>
            <label>
                <strong>Primary Color:</strong><br>
                <input type="color" id="set-primary-color" value="#0056b3" onchange="updateSettings()" style="cursor: pointer;">
            </label>
            <label>
                <strong>Accent Color:</strong><br>
                <input type="color" id="set-accent-color" value="#00a8ff" onchange="updateSettings()" style="cursor: pointer;">
            </label>
            <label>
                <strong>Font Size:</strong><br>
                <select id="set-font-size" onchange="updateSettings()" style="padding: 5px; border-radius: 4px; cursor: pointer;">
                    <option value="14px">Small</option>
                    <option value="16px" selected>Normal</option>
                    <option value="18px">Large</option>
                </select>
            </label>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3><i class="fa-solid fa-graduation-cap"></i> Canvas Integration</h3>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary);">
                <p style="margin: 0; font-size: 14px; color: var(--text-muted);">
                    <i class="fa-solid fa-circle-info" style="color: var(--primary); margin-right: 8px;"></i>
                    Your Canvas access token is stored locally in your browser and never sent to our servers.
                </p>
            </div>
            <label>
                <strong>Canvas Instance URL:</strong><br>
                <input type="url" id="canvas-base-url" placeholder="https://learn.irvingisd.net" oninput="updateCanvasSettings()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 400px; font-family: monospace; font-size: 14px;">
                <small style="color: var(--text-muted); display: block; margin-top: 4px;">Your school's Canvas URL (e.g., https://learn.irvingisd.net)</small>
            </label>
            <label>
                <strong>Access Token:</strong><br>
                <input type="password" id="canvas-access-token" placeholder="Enter your Canvas access token" oninput="updateCanvasSettings()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 400px; font-family: monospace; font-size: 14px;">
                <small style="color: var(--text-muted); display: block; margin-top: 4px;">
                    Get your token from: <a href="https://canvas.instructure.com/profile/settings" target="_blank" style="color: var(--primary);">Canvas Settings → Approved Integrations</a>
                </small>
            </label>
            <button onclick="testCanvasConnection()" id="test-canvas-btn" style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; width: fit-content;">
                <i class="fa-solid fa-plug"></i> Test Connection
            </button>
            <div id="canvas-test-result" style="display: none; padding: 10px; border-radius: 8px; margin-top: 10px;"></div>
        </div>
    </div>
</section>
