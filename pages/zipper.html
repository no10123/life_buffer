<section id="zipper">
<header class="section-header">
    <h1>Zipper</h1>
</header>

<div class="card">
    <h2 style="margin-top:0">Folder Content Zipper</h2>
    <p style="color: #64748b; font-size: 0.9rem;">Select a folder to zip its contents (excluding the parent folder itself).</p>
    
    <div id="drop-area">
        Click to select a <br><strong>Folder</strong>
    </div>
    
    <input type="file" id="folder-input" webkitdirectory directory style="display: none;">
    
    <button id="dl-btn" disabled>Download Stored ZIP</button>
    <div id="status">Ready</div>
</div>

</section>
