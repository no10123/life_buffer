<section id="zipper">
<header class="section-header">
    <h1>Zipper</h1>
</header>

<div class="card">
    <h2 style="margin-top:0">Folder Content Zipper</h2>
    <p style="color: #64748b; font-size: 0.9rem;">Select a folder to zip its contents (excluding the parent folder itself).</p>
    
    <div id="drop-area">
        Click to select a <br><strong>Folder</strong>
    </div>
    
    <input type="file" id="folder-input" webkitdirectory directory style="display: none;">
    
    <button id="dl-btn" disabled>Download Stored ZIP</button>
    <div id="status">Ready</div>
</div>

<script>
    const folderInput = document.getElementById('folder-input');
    const dropArea = document.getElementById('drop-area');
    const dlBtn = document.getElementById('dl-btn');
    const status = document.getElementById('status');
    
    let zip = new JSZip();

    dropArea.onclick = () => folderInput.click();

    folderInput.onchange = (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        zip = new JSZip();
        let count = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fullPath = file.webkitRelativePath;
            const pathParts = fullPath.split('/');
            pathParts.shift(); 
            const internalPath = pathParts.join('/');

            if (internalPath) {
                zip.file(internalPath, file);
                count++;
            }
        }

        status.innerText = `Prepared ${count} items from inside the folder.`;
        dlBtn.disabled = false;
    };

    dlBtn.onclick = async () => {
        status.innerText = "Bundling...";
        dlBtn.disabled = true;

        try {
            // compression: "STORE" ensures a flat, uncompressed archive
            const blob = await zip.generateAsync({type: "blob", compression: "STORE"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "folder_contents.zip";
            a.click();
            URL.revokeObjectURL(url);
            status.innerText = "Done!";
        } catch (err) {
            status.innerText = "Error: " + err.message;
        } finally {
            dlBtn.disabled = false;
        }
    };
</script>
</section>
